name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v5

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}

      # The code under test is standard library only; the dev group in
      # uv.lock (pytest, pre-commit) is the whole dependency set. --locked
      # fails if uv.lock is out of date with pyproject.toml.
      - name: Install dev dependencies
        run: uv sync --locked

      - name: Run tests
        run: make test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v5

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: uv sync --locked

      - name: Run pre-commit hooks
        run: make lint

  plugins:
    name: Validate plugin manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v5

      # Catches the most common marketplace break: a plugin listed in
      # marketplace.json whose source directory or manifest is missing.
      - name: Check every listed plugin resolves
        run: make check-plugins
