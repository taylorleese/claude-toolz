name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: ${{ matrix.python-version }}

      # The code under test is standard library only, so pytest is the whole
      # test-time dependency set. No lockfile, no hashes, nothing to bump.
      - name: Install pytest
        run: python -m pip install --no-cache-dir pytest

      - name: Run tests
        run: make test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v5

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.13"

      - name: Install pre-commit
        run: python -m pip install --no-cache-dir pre-commit

      - name: Run pre-commit hooks
        run: make lint

  plugins:
    name: Validate plugin manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v5

      # Catches the most common marketplace break: a plugin listed in
      # marketplace.json whose source directory or manifest is missing.
      - name: Check every listed plugin resolves
        run: make check-plugins
