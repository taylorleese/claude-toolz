version: 2
# The only dependency surface left in this repo is GitHub Actions. The plugins
# are markdown and shell; the one Python script uses the standard library, so
# there is no manifest or lockfile for the pip ecosystem to track.
#
# Vulnerability alerts are a repository setting, not a file: they are enabled
# under Settings > Code security > Dependabot alerts and are unaffected by this
# config. This file governs version-bump pull requests only.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "main"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
