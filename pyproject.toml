# Tooling configuration only. This repository is a Claude Code plugin
# marketplace, not a Python package — there is no [project] table, nothing is
# built, and nothing is published to a package index.

[tool.ruff]
line-length = 140
target-version = "py313"

[tool.ruff.lint]
# S replaces the standalone bandit hook; D replaces pydocstyle;
# I replaces isort; E/F/W replace flake8.
select = [
    "E", "F", "I", "N", "W", "UP", "B", "A", "C4", "DTZ", "T10", "EM", "ISC",
    "ICN", "PIE", "PT", "Q", "RSE", "RET", "SIM", "TID", "ARG", "PLE", "PLW",
    "RUF", "S", "D",
]
ignore = [
    "D100",  # Module docstring not required in every file
    "D104",  # Package docstring not required
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",    # assert is the point of a test
    "ARG002",  # unused args are common with mock fixtures
]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
mypy_path = "plugins/ask-llm/skills/ask-llm/scripts"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
